<script>
/* Se o navegador guardou uma versão antiga da página, busca a nova e recarrega uma vez. */
(function () {
  var V = "11", aqui = location.pathname + location.search;
  try { if (sessionStorage.getItem("recarregou") === V) return; } catch (e) {}
  fetch(location.pathname + "?nc=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
    var m = t.match(/name="versao" content="(\d+)"/);
    if (m && m[1] !== V) {
      try { sessionStorage.setItem("recarregou", V); } catch (e) {}
      fetch(aqui, { cache: "reload" }).finally(function () { location.reload(); });
    }
  }).catch(function () {});
})();
</script>
